<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Game 🎲</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <header>
        <section class="game-head">
          <h1 class="game-title">Dice Game</h1>
          <p id="rounds"><span id="count-el">0</span> of 5 rounds played</p>
        </section>
        <p class="game-information">
          Highest roll wins a point. Best score after five rounds wins.
        </p>
      </header>

      <section class="player-container">
        <section class="player" id="user-card"  >
          <p id="player1-el" class="player-name"></p>
          <div class="dice">
            <p id="user-el" class="dice-number">-</p>
          </div>
          <p class="score" id="score1-el"></p>
          <p class="winner" id="user-winner"></p>
        </section>
        <section class="player" id="computer-card">
          <p id="player2-el" class="player-name"></p>
          <div class="dice black">
            <p id="computer-el" class="dice-number white">-</p>
          </div>
          <p class="score" id="score2-el"></p>
          <p class="winner" id="computer-winner"></p>
        </section>
      </section>
      <p id="message-el">READY ?</p>
      <section class="play-buttons">
        <button id="rollbtn" onclick="rollDice()">ROLL DICE</button>
        <button class="restart" onclick="restart()">RESTART</button>
      </section>
      <section class="game-history">
        <p>Round History</p>
        <section class="history-container">
          <div class="round-card">
            <div class="left-card">
              <p class="round-num"></p>
              <p class="round-dice"></p>
            </div>
            <div class="right-card">
              <p class="round-winner"></p>
            </div>
          </div>
          <div class="round-card">
            <div class="left-card">
              <p class="round-num"></p>
              <p class="round-dice"></p>
            </div>
            <div class="right-card">
              <p class="round-winner"></p>
            </div>
          </div>
          <div class="round-card">
            <div class="left-card">
              <p class="round-num"></p>
              <p class="round-dice"></p>
            </div>
            <div class="right-card">
              <p class="round-winner"></p>
            </div>
          </div>
          <div class="round-card">
            <div class="left-card">
              <p class="round-num"></p>
              <p class="round-dice"></p>
            </div>
            <div class="right-card">
              <p class="round-winner"></p>
            </div>
          </div>
          <div class="round-card">
            <div class="left-card">
              <p class="round-num"></p>
              <p class="round-dice"></p>
            </div>
            <div class="right-card">
              <p class="round-winner"></p>
            </div>
          </div>
        </section>
      </section>
    </main>
    <div id="modal-backdrop"></div>
    <section id="game-modal" class="gradient-a">
      <button type="button" onclick="closeModal()" class="close-btn">×</button>
      
      <div class="winner-log">
        <span class="win-icon" id="icon">🏆</span>
        <h2 class="winner-name"></h2>
      <p class="win-message">Congratulations! You've won the game</p>
      </div>
      
      <div class="winner-stats">
        <div class="player1-score">
          <p class="name">You</p>
          <p class="score" id="score1"></p>
        </div>
        <p class="dash">-</p>
        <div class="player2-score">
          <p class="name">Computer</p>
          <p class="score" id="score2"></p>
        </div>
      </div>
      <button type="button" onclick="restart()" class="play"  tabindex="0">Play again</button>
    </section>
    <script src="index.js"></script>
  </body>
</html>
